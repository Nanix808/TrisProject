version: "3.9"
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: "tris"
      POSTGRES_USER: "test"
      POSTGRES_PASSWORD: "test"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mycustomnetwork  


  postgres_test:
    image: postgres:latest
    environment:
      POSTGRES_DB: "tris_test"
      POSTGRES_USER: "test"
      POSTGRES_PASSWORD: "test"
    ports:
      - "5434:5432"
    networks:
      - mycustomnetwork      


volumes:
  postgres-data:


networks:
  mycustomnetwork:
    driver: bridge